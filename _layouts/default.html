<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>{{ site.title }}{% if page.title %} : {{ page.title }}{% endif %}</title>
  {% include head.html %}
</head>

<body>
  <div id="wrapper">

    <div id="header">
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/img/dancefloor header 4.jpg' | relative_url }}" alt="Header" class="headerimg">
      </a>
    </div>

    <div id="radio-mobile-slot"></div>

    <div id="main">
      <div id="sidebar">
        {% include sidebar.html %}
      </div>

      <div id="content">
        {{ content }}
      </div>
    </div>

    <div class="footer">
      © {{ site.time | date: "%Y" }} {{ site.title }}
    </div>

    <!-- Mixcloud iframe stays here. Moving it with the radio chrome reloads
         the widget and mobile play stops working. -->
    <iframe
      id="mixcloud-player"
      class="mixcloud-hidden-player"
      src="https://player-widget.mixcloud.com/widget/iframe/?hide_cover=1&mini=1&light=0&hide_artwork=1&feed=%2Fdjbasura%2Fstuck-on-repeat-an-indie-electro-blog-house-mix%2F"
      frameborder="0"
      allow="encrypted-media; autoplay"
      title="Indie Sleaze Radio"></iframe>

  </div>

  <script src="{{ '/assets/js/lightbox.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/js/persist-nav.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="https://widget.mixcloud.com/media/js/widgetApi.js"></script>
  <script src="{{ '/assets/js/radio.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

</body>
</html>
