name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub's "Upload files" UI defaults to the repo root. Photos that
      # land there get published at https://lookgood.party/051.jpg and can
      # flood the Pages CDN with extra requests. They belong in
      # img/<gallery>/full/ — drop them from this build only.
      - name: Ignore photos accidentally uploaded to the repo root
        run: |
          shopt -s nullglob
          extras=( *.jpg *.jpeg *.png *.gif *.JPG *.JPEG *.PNG *.GIF )
          if ((${#extras[@]})); then
            echo "Photos in the repository root are not published. Put them in img/<gallery>/full/ instead:"
            printf '  %s\n' "${extras[@]}"
            rm -f -- "${extras[@]}"
          fi

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # Thumbs committed by the other workflow do not retrigger this one
      # (GitHub blocks GITHUB_TOKEN from starting new workflows). Build
      # missing thumbs here so a new gallery is visible on the first deploy.
      - name: Generate missing thumbnails
        run: bash .github/scripts/generate_thumbs.sh

      - name: Add guestbook posting key for this build only
        env:
          GUESTBOOK_TOKEN: ${{ secrets.GUESTBOOK_TOKEN }}
        run: python3 .github/scripts/inject_guestbook_auth.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
