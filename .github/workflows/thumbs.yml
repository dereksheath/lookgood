name: Build thumbnails

on:
  push:
    branches: [ "main" ]
    paths:
      - "img/**"

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate thumbs
        run: bash .github/scripts/generate_thumbs.sh

      - name: Commit thumbs
        run: |
          git config user.name "lookgood-bot"
          git config user.email "actions@users.noreply.github.com"

          if git status --porcelain | grep -q "img/"; then
            git add img
            git commit -m "Auto-generate thumbnails"
            git push
          else
            echo "Nothing to commit."
          fi
